<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Velavan N</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .font-godber {
            font-family: 'Cinzel', serif;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-extrabold tracking-wider font-godber bg-gradient-to-r from-cyan-400 to-teal-400 bg-clip-text text-transparent">
                    VELAVAN N
                </a>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800/50">Admin Panel</span>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-slate-300 hover:text-cyan-400 text-sm font-medium transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-house"></i> View Portfolio
                </a>
                <button onclick="logoutAdmin()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-10">
        
        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight font-godber text-slate-100">Help Desk <span class="text-cyan-400">Inquiries</span></h1>
                <p class="text-slate-400 text-sm mt-1">Live inquiries submitted through your portfolio's request call form.</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button onclick="exportToExcel()" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-semibold px-4 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel"></i> Export to Excel
                </button>
                <button onclick="fetchRequests()" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-400 font-semibold px-4 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh Data
                </button>
            </div>
        </div>

        <!-- Metric Counter & Search Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900/60 backdrop-blur-sm p-6 rounded-2xl border border-slate-800 flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Total Submissions</p>
                    <h3 id="totalRequestsCount" class="text-3xl font-extrabold text-cyan-400 mt-1 font-godber">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-cyan-950/80 border border-cyan-800/50 flex items-center justify-center text-cyan-400 text-xl">
                    <i class="fa-solid fa-inbox"></i>
                </div>
            </div>

            <div class="md:col-span-2 bg-slate-900/60 backdrop-blur-sm p-6 rounded-2xl border border-slate-800 flex items-center">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" onkeyup="filterRequests()" placeholder="Search by client name, mobile number, or message..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 pl-11 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors text-sm">
                </div>
            </div>
        </div>

        <!-- Requests Table Card -->
        <div class="bg-slate-900/60 backdrop-blur-sm rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-950/80 border-b border-slate-800 text-slate-400 font-semibold font-godber text-xs tracking-wider">
                            <th class="py-4 px-6">Date & Time</th>
                            <th class="py-4 px-6">Client Name</th>
                            <th class="py-4 px-6">Mobile Number</th>
                            <th class="py-4 px-6">Message / Query</th>
                            <th class="py-4 px-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody" class="divide-y divide-slate-800/60 text-slate-300">
                        <tr>
                            <td colspan="5" class="py-12 text-center text-slate-500">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 text-cyan-400 block"></i>
                                Loading submissions from database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-slate-500 text-xs border-t border-slate-900 bg-black/40">
        <p>&copy; 2026 Velavan N. All rights reserved.</p>
    </footer>

    <!-- Script to Fetch, Filter, Export, and Delete Requests -->
    <script>
        let allRequests = [];

        async function fetchRequests() {
            const tableBody = document.getElementById('requestsTableBody');
            const countDisplay = document.getElementById('totalRequestsCount');
            
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-12 text-center text-slate-500">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 text-cyan-400 block"></i>
                        Connecting to database...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch('https://portfolio-hj32.onrender.com/api/requests');
                if (!response.ok) throw new Error('Network response was not ok');

                allRequests = await response.json();
                countDisplay.innerText = allRequests.length;
                renderTable(allRequests);

            } catch (error) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-12 text-center text-rose-400 font-medium">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>
                            Could not connect to database server. Ensure your backend is running.
                        </td>
                    </tr>
                `;
            }
        }

        function renderTable(requests) {
            const tableBody = document.getElementById('requestsTableBody');

            if (requests.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-500">
                            <i class="fa-solid fa-folder-open text-2xl mb-2 block text-slate-600"></i>
                            No call requests found in the database.
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = requests.map(req => {
                const date = req.createdAt ? new Date(req.createdAt).toLocaleString('en-IN', {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                }) : 'N/A';

                return `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="py-4 px-6 text-xs text-slate-400 font-medium whitespace-nowrap">${date}</td>
                        <td class="py-4 px-6 font-semibold text-slate-100 whitespace-nowrap">${escapeHTML(req.name)}</td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <a href="tel:${escapeHTML(req.mobile)}" class="text-cyan-400 hover:text-cyan-300 transition-colors inline-flex items-center gap-1.5 font-medium">
                                <i class="fa-solid fa-phone text-xs"></i> ${escapeHTML(req.mobile)}
                            </a>
                        </td>
                        <td class="py-4 px-6 max-w-md break-words text-slate-300 leading-relaxed">${escapeHTML(req.comment)}</td>
                        <td class="py-4 px-6 text-center whitespace-nowrap space-x-2">
                            <a href="tel:${escapeHTML(req.mobile)}" class="bg-cyan-950 hover:bg-cyan-900 border border-cyan-800/60 text-cyan-300 text-xs px-3 py-1.5 rounded-lg transition-all inline-flex items-center gap-1 font-medium">
                                <i class="fa-solid fa-phone-volume"></i> Call
                            </a>
                            <button onclick="deleteRequest('${req._id}')" class="bg-rose-950/60 hover:bg-rose-900 border border-rose-800/60 text-rose-300 text-xs px-3 py-1.5 rounded-lg transition-all inline-flex items-center gap-1 font-medium">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function deleteRequest(id) {
            if (!confirm('Are you sure you want to delete this request?')) return;

            try {
                const response = await fetch(`https://portfolio-hj32.onrender.com/api/requests/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    // Remove from local array and re-render
                    allRequests = allRequests.filter(req => req._id !== id);
                    document.getElementById('totalRequestsCount').innerText = allRequests.length;
                    filterRequests();
                } else {
                    alert('Failed to delete request.');
                }
            } catch (error) {
                alert('Error connecting to server.');
            }
        }

        function exportToExcel() {
            if (allRequests.length === 0) {
                alert('No data available to export.');
                return;
            }

            // Map data for clean excel formatting
            const excelData = allRequests.map((req, index) => ({
                'S.No': index + 1,
                'Date & Time': req.createdAt ? new Date(req.createdAt).toLocaleString('en-IN') : 'N/A',
                'Client Name': req.name,
                'Mobile Number': req.mobile,
                'Message / Query': req.comment
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Call Requests");

            // Trigger file download
            XLSX.writeFile(workbook, "Velavan_Portfolio_Inquiries.xlsx");
        }

        function filterRequests() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRequests.filter(req => 
                (req.name && req.name.toLowerCase().includes(query)) ||
                (req.mobile && req.mobile.toLowerCase().includes(query)) ||
                (req.comment && req.comment.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function logoutAdmin() {
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', fetchRequests);
    </script>
</body>
</html>
