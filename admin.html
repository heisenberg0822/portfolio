<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Help Desk Queries</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans leading-relaxed min-h-screen p-6 md:p-12">

    <!-- Top Navigation -->
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-10 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-cyan-400">Admin Dashboard</h1>
            <p class="text-slate-400 text-sm">Review all incoming call requests and queries stored in local MongoDB.</p>
        </div>
        <a href="index.html" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

    <!-- Data Table Section -->
    <div class="max-w-6xl mx-auto bg-slate-900/60 backdrop-blur-sm border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="font-bold text-lg text-slate-200"><i class="fa-solid fa-database mr-2 text-cyan-400"></i> Query Database</h2>
            <button onclick="fetchRequests()" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                        <th class="py-4 px-6 font-semibold">Name</th>
                        <th class="py-4 px-6 font-semibold">Mobile Number</th>
                        <th class="py-4 px-6 font-semibold">Comment / Query</th>
                        <th class="py-4 px-6 font-semibold">Date & Time</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody" class="divide-y divide-slate-800/60 text-sm text-slate-300">
                    <tr>
                        <td colspan="4" class="py-8 text-center text-slate-500">Loading queries from database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-500">Refreshing data...</td></tr>`;

            try {
                const response = await fetch('http://localhost:5000/api/requests');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(req => {
                        const dateFormatted = new Date(req.date).toLocaleString();
                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-800/40 transition-colors">
                                <td class="py-4 px-6 font-medium text-slate-100">${escapeHtml(req.name)}</td>
                                <td class="py-4 px-6"><a href="tel:${escapeHtml(req.mobile)}" class="text-cyan-400 hover:underline">${escapeHtml(req.mobile)}</a></td>
                                <td class="py-4 px-6 text-slate-300 max-w-md">${escapeHtml(req.comment)}</td>
                                <td class="py-4 px-6 text-slate-500 text-xs">${dateFormatted}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-500">No queries found in the database.</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-rose-400">Could not connect to database server. Ensure your backend is running.</td></tr>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        fetchRequests();
    </script>

</body>
</html>
